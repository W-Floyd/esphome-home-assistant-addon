name: Build patched add-on image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: esphome
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_FROM=ghcr.io/esphome/esphome-hassio:2026.5.1
          tags: |
            ghcr.io/w-floyd/esphome-hassio:2026.5.1
            ghcr.io/w-floyd/esphome-hassio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
